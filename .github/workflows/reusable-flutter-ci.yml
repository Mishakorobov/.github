name: Reusable Flutter CI (FinOps)

on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Pinned Flutter SDK version'
        required: false
        type: string
        default: '3.38.9'
      force-build-apk:
        description: 'Force Debug APK compilation even without android/ or pubspec changes'
        required: false
        type: boolean
        default: false

jobs:
  fast_verify:
    name: Fast Verify (Analyze & Tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    outputs:
      need_apk: ${{ steps.apk_gate.outputs.need_apk }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Android/dependency changes
        id: changes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            android:
              - 'android/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test

      - name: Evaluate conditional APK build gate
        id: apk_gate
        env:
          FORCE_BUILD: ${{ inputs.force-build-apk }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build-apk') }}
          ANDROID_CHANGED: ${{ steps.changes.outputs.android }}
        run: |
          if [ "$FORCE_BUILD" = "true" ] || [ "$HAS_LABEL" = "true" ] || [ "$ANDROID_CHANGED" = "true" ]; then
            echo "need_apk=true" >> "$GITHUB_OUTPUT"
            echo "APK build required (android/pubspec changed or explicitly requested)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "need_apk=false" >> "$GITHUB_OUTPUT"
            echo "FinOps Skip: Android/Gradle build skipped (no android/ or pubspec changes)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build_debug_apk:
    name: Conditional Debug APK Build
    needs: fast_verify
    if: ${{ needs.fast_verify.outputs.need_apk == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
          cache: true

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Gradle wrapper is executable
        run: test -f android/gradlew && chmod +x android/gradlew || true

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation
