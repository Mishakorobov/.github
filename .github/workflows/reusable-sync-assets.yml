name: Reusable Sync Rosguard Assets

on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Pinned Flutter SDK version'
        required: false
        type: string
        default: '3.38.9'
      data-repo:
        description: 'Source data repository (owner/name)'
        required: false
        type: string
        default: 'Mishakorobov/rosguard-tickets-data'
      data-ref:
        description: 'Branch or tag to sync assets from'
        required: false
        type: string
        default: 'main'

jobs:
  sync_and_verify:
    name: Sync Tickets JSON & Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and verify SHA-256 of tickets assets
        id: sync
        env:
          DATA_REPO: ${{ inputs.data-repo }}
          DATA_REF: ${{ inputs.data-ref }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, urllib.request

          data_repo = os.environ["DATA_REPO"]
          data_ref = os.environ["DATA_REF"]
          base = f"https://raw.githubusercontent.com/{data_repo}/{data_ref}"
          files = {
              "questions_manifest.json": "assets/questions_manifest.json",
              "questions.json": "assets/questions.json",
              "questions_private.json": "assets/questions_private.json",
          }

          for remote_name, local_path in files.items():
              url = f"{base}/{remote_name}"
              req = urllib.request.Request(url, headers={"User-Agent": "RosguardSyncBot/1.0"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read()
              os.makedirs(os.path.dirname(local_path), exist_ok=True)
              with open(local_path, "wb") as f:
                  f.write(data)

          with open("assets/questions_manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          def sha256_lf(path):
              with open(path, "rb") as f:
                  raw = f.read().replace(b"\r\n", b"\n")
              return hashlib.sha256(raw).hexdigest().lower()

          vohr_actual = sha256_lf("assets/questions.json")
          vohr_expected = manifest["vohr"]["sha256"].lower()
          priv_actual = sha256_lf("assets/questions_private.json")
          priv_expected = manifest["private_guard"]["sha256"].lower()

          if vohr_actual != vohr_expected:
              print(f"SHA-256 mismatch for questions.json: {vohr_actual} != {vohr_expected}", file=sys.stderr)
              sys.exit(1)
          if priv_actual != priv_expected:
              print(f"SHA-256 mismatch for questions_private.json: {priv_actual} != {priv_expected}", file=sys.stderr)
              sys.exit(1)

          summary = (
              f"Updated at: {manifest.get('updated_at')} | "
              f"VOHR: {manifest['vohr'].get('questions_count')} | "
              f"CHOP: {manifest['private_guard'].get('questions_count')}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"summary={summary}\n")
          print("Integrity OK:", summary)
          PY

          if git diff --quiet assets/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No asset changes detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter (only if assets changed)
        if: steps.sync.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
          cache: true

      - name: Verify compatibility with Flutter analyze and tests
        if: steps.sync.outputs.changed == 'true'
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Create or update Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(assets): авто-синхронизация билетов Росгвардии"
          branch: chore/sync-rosguard-tickets
          delete-branch: true
          title: "chore(assets): обновление базы билетов Росгвардии"
          body: |
            Автоматическое обновление встроенной базы вопросов из `${{ inputs.data-repo }}`.

            - **Сводка манифеста:** ${{ steps.sync.outputs.summary }}
            - **Целостность SHA-256:** ✅ Подтверждена
            - **Статический анализ (`flutter analyze`) и тесты (`flutter test`):** ✅ Пройдены перед открытием PR
